name: Build OCI images

# Reusable workflow for one OCI distroless image target (elements/oci/*,
# published under `oci_images` in elements/targets.json). build.yml calls this
# once per target so a slow or failed image never delays another image's
# manifest, signing, or attestation.

on:
  workflow_call:
    inputs:
      image:
        description: OCI image name, validated against elements/targets.json by build.yml
        required: true
        type: string
      archs:
        description: JSON array of host architectures to build/publish for this image, from the 'archs' map in elements/targets.json
        required: true
        type: string
      ref:
        description: Git ref to check out (supports repository_dispatch client_payload.ref).
        required: true
        type: string

concurrency:
  # Serialize only conflicting publication for this ref/image; other targets
  # remain free to build, verify, sign, and publish in parallel.
  group: oci-image-${{ inputs.ref }}-${{ inputs.image }}
  cancel-in-progress: true

jobs:
  resolve:
    # Map the per-image arch list from targets.json onto the runner and
    # platform matrix entries, so no arch/runner list is hand-maintained in
    # this workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_matrix: ${{ steps.set.outputs.build_matrix }}
      smoke_matrix: ${{ steps.set.outputs.smoke_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: set
        run: |
          echo "build_matrix=$(jq -nc --arg img '${{ inputs.image }}' '
            [ (.archs[$img] // ["x86_64", "aarch64"])[] as $arch
              | { arch: $arch,
                  runner: (if $arch == "x86_64" then "ubuntu-24.04" else "ubuntu-24.04-arm" end) } ]'
            elements/targets.json)" >> "$GITHUB_OUTPUT"
          echo "smoke_matrix=$(jq -nc --arg img '${{ inputs.image }}' '
            [ (.archs[$img] // ["x86_64", "aarch64"])[] as $arch
              | { tag_arch: $arch,
                  platform_arch: (if $arch == "x86_64" then "amd64" else "arm64" end),
                  runner: (if $arch == "x86_64" then "ubuntu-24.04" else "ubuntu-24.04-arm" end) } ]'
            elements/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Compute lowercase image registry
        run: echo "BUILD_IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Compute OCI Metadata
        run: |
          echo "OCI_IMAGE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OCI_IMAGE_CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - name: Log in to ghcr
        # repository_dispatch is verification-only for an unmerged FSDK bump;
        # never publish branch content to production tags.
        if: github.event_name != 'repository_dispatch'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and verify image
        run: |
          BUILD_IMAGE_NAME=${{ inputs.image }} just build
          BUILD_IMAGE_NAME=${{ inputs.image }} just verify
      - name: Vulnerability scan (grype)
        # Gate: fails on high/critical findings that have a fix available.
        run: just scan "${{ inputs.image }}"
      - name: Publish architecture image
        if: github.event_name != 'repository_dispatch'
        run: BUILD_IMAGE_NAME=${{ inputs.image }} just tag-push "${BUILD_IMAGE_REGISTRY}/${{ inputs.image }}-${{ matrix.arch }}"

  manifest:
    outputs:
      digest: ${{ steps.resolve-digest.outputs.digest }}
      tag: ${{ steps.resolve-digest.outputs.tag }}
    needs: [build, resolve]
    # repository_dispatch is verification-only for an unmerged FSDK bump;
    # never publish branch content to production tags.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write # Required for Sigstore keyless signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Compute lowercase image registry
        run: echo "BUILD_IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just, syft

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Log in to ghcr
        run: |
          mkdir -p ~/.docker
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin --compat-auth-file ~/.docker/config.json

      - name: Generate image SBOMs with syft
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image }}"
          POINT_TAG="$(just tags | tail -1)"
          podman pull -q "${BUILD_IMAGE_REGISTRY}/${IMAGE}-x86_64:${POINT_TAG}"
          just sbom "${IMAGE}" "${BUILD_IMAGE_REGISTRY}/${IMAGE}-x86_64:${POINT_TAG}"

      - name: Assemble multi-arch manifest, sign, and attach SBOM
        id: resolve-digest
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image }}"
          REPO="${BUILD_IMAGE_REGISTRY}/${IMAGE}"

          # Check which per-architecture images were successfully built and published
          POINT_TAG="$(just tags | tail -1)"
          ARCHS="$(jq -r --arg img "$IMAGE" '.archs[$img][]' elements/targets.json)"
          AVAIL_ARCHS=()
          for arch in ${ARCHS}; do
            if skopeo inspect --no-tags --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${REPO}-${arch}:${POINT_TAG}" >/dev/null 2>&1; then
              AVAIL_ARCHS+=("${arch}")
            fi
          done

          EXPECTED_ARCH_COUNT="$(jq --arg img "$IMAGE" '.archs[$img] | length' elements/targets.json)"
          if [ ${#AVAIL_ARCHS[@]} -ne "${EXPECTED_ARCH_COUNT}" ]; then
            echo "ERROR: Expected ${EXPECTED_ARCH_COUNT} staging images for ${REPO}:${POINT_TAG} (${ARCHS//$'\n'/ }); found: ${AVAIL_ARCHS[*]:-none}" >&2
            exit 1
          fi

          echo "==> Found per-architecture images for ${IMAGE} at ${POINT_TAG}: ${AVAIL_ARCHS[*]}"

          # Step 1: Create, annotate, and push tags.
          # The FSDK point-release/beta tag is immutable: skip it if already published.
          FIRST_TAG=""
          while read -r t; do
            if [[ "${t}" == "${POINT_TAG}" ]] && skopeo inspect --no-tags --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${REPO}:${t}" >/dev/null 2>&1; then
              echo "==> skipping ${REPO}:${t} (point-release tag already published, immutable)"
              continue
            fi
            if [[ -z "${FIRST_TAG}" ]]; then
              FIRST_TAG="${t}"
            fi
            podman manifest create "${REPO}:${t}"
            for arch in "${AVAIL_ARCHS[@]}"; do
              podman manifest add "${REPO}:${t}" "docker://${REPO}-${arch}:${t}"
            done

            podman manifest push --all "${REPO}:${t}" "docker://${REPO}:${t}"
            echo "==> published ${REPO}:${t} (${AVAIL_ARCHS[*]})"
          done < <(just tags)

          if [[ -z "${FIRST_TAG}" ]]; then
            echo "==> No tags were published for ${IMAGE}; skipping signing and attestation."
            exit 0
          fi

          # Step 2: Resolve canonical manifest list digest exactly once
          DIGEST=$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" "docker://${REPO}:${FIRST_TAG}" | jq -r '.Digest')
          if [[ -z "${DIGEST}" || "${DIGEST}" == "null" ]]; then
            echo "ERROR: Failed to resolve digest for ${REPO}:${FIRST_TAG}"
            exit 1
          fi
          echo "==> Canonical digest for ${REPO}:${FIRST_TAG}: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${FIRST_TAG}" >> "$GITHUB_OUTPUT"

          # Step 3: Keyless-sign the OCI image manifest list digest exactly once
          cosign sign -y "${REPO}@${DIGEST}"

          # Step 4: Attach and sign both image SBOMs (SPDX + CycloneDX) exactly once
          for sbom in \
            "${IMAGE}.spdx.json:application/vnd.spdx+json" \
            "${IMAGE}.cyclonedx.json:application/vnd.cyclonedx+json"; do
            SBOM_FILE="${sbom%%:*}"
            ARTIFACT_TYPE="${sbom#*:}"
            if [[ -f "${SBOM_FILE}" ]]; then
              echo "==> Attaching SBOM ${SBOM_FILE} (${ARTIFACT_TYPE}) to ${REPO}@${DIGEST}..."

              SBOM_REF=$(oras attach \
                --format json \
                --no-tty \
                --artifact-type "${ARTIFACT_TYPE}" \
                --annotation "filename=${SBOM_FILE}" \
                "${REPO}@${DIGEST}" \
                "${SBOM_FILE}" \
                | jq -r '.digest')

              if [[ -n "${SBOM_REF}" && "${SBOM_REF}" != "null" ]]; then
                SBOM_DIGEST="${SBOM_REF#*@}"
                echo "==> Signing SBOM artifact ${REPO}@${SBOM_DIGEST}..."
                cosign sign -y "${REPO}@${SBOM_DIGEST}"
              else
                echo "WARNING: Failed to capture SBOM digest for ${REPO}:${FIRST_TAG}"
              fi
            fi
          done

      - name: Generate GitHub artifact attestation
        if: steps.resolve-digest.outputs.digest != ''
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.BUILD_IMAGE_REGISTRY }}/${{ inputs.image }}
          subject-digest: ${{ steps.resolve-digest.outputs.digest }}
          push-to-registry: true

  publish-smoke:
    needs: [manifest, resolve]
    if: needs.manifest.result == 'success' && needs.manifest.outputs.digest != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.smoke_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.manifest.outputs.tag }}
      MANIFEST_DIGEST: ${{ needs.manifest.outputs.digest }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Compute lowercase image ref
        run: echo "REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_ENV"

      - name: Log in to ghcr
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin --compat-auth-file ~/.docker/config.json

      - name: Pull and run published architecture image
        env:
          TAG_ARCH: ${{ matrix.tag_arch }}
          PLATFORM_ARCH: ${{ matrix.platform_arch }}
        run: |
          set -euo pipefail
          arch_digest="$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://${REPO}-${TAG_ARCH}:${TAG}" | jq -r '.Digest')"
          test "${arch_digest}" != "" && test "${arch_digest}" != "null"
          podman pull --platform "linux/${PLATFORM_ARCH}" "${REPO}@${arch_digest}"
          actual_arch="$(podman image inspect --format '{{.Architecture}}' "${REPO}@${arch_digest}")"
          test "${actual_arch}" = "${PLATFORM_ARCH}"
          # All published images must be runnable with their OCI config.
          case "${{ inputs.image }}" in
            base|static|arch) podman run --rm --platform "linux/${PLATFORM_ARCH}" "${REPO}@${arch_digest}" /usr/bin/true ;;
            bootc) podman run --rm --privileged --systemd=true --platform "linux/${PLATFORM_ARCH}" "${REPO}@${arch_digest}" /usr/bin/systemctl --version ;;
            *) echo "ERROR: no publish smoke command configured for ${{ inputs.image }}" >&2; exit 1 ;;
          esac

      - name: Verify published manifest signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${REPO}@${MANIFEST_DIGEST}"

      - name: Verify published SBOM referrers
        run: |
          set -euo pipefail
          oras discover "${REPO}@${MANIFEST_DIGEST}" --format json \
            | jq -e '.. | objects | select(.artifactType == "application/vnd.spdx+json")' >/dev/null
          oras discover "${REPO}@${MANIFEST_DIGEST}" --format json \
            | jq -e '.. | objects | select(.artifactType == "application/vnd.cyclonedx+json")' >/dev/null

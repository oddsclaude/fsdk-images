name: Build images

# Orchestrator: resolves the canonical OCI image manifest once (see
# elements/targets.json / just image-matrix), then fans out to the reusable
# per-image workflow (oci-images.yml) so a failure in one unrelated image
# never blocks or obscures another's status in the Actions UI.

on:
  push:
  pull_request:
  # Publish builds run on a cadence (Mon, Wed, Sun 03:00 UTC), not on every
  # push to main. PRs still build as the pull-request gate, and
  # workflow_dispatch provides on-demand builds.
  schedule:
    - cron: '0 3 * * 1,3,0'
  repository_dispatch:
    types: [fsdk-updated]
  workflow_dispatch:
    inputs:
      image:
        description: Optional OCI image to build; leave empty to build every manifest target
        required: false
        default: ""
        type: string

concurrency:
  # A targeted manual run must not cancel an unrelated image's targeted run.
  # oci-images.yml independently serializes publication for the same image.
  group: build-${{ github.event.client_payload.ref || github.ref }}-${{ github.event.inputs.image || 'all' }}
  cancel-in-progress: true

# Ceiling permissions for the whole run. Reusable-workflow calling jobs
# (oci-images) cannot be granted more than this; each restricts further to
# only what its own jobs use. Jobs that don't call a reusable workflow set
# their own, narrower `permissions:` below.
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just
      - name: Resolve element graph
        run: just validate
      - name: Validate OCI publish smoke contract
        run: tests/oci-publish-smoke-contract.sh

  # Pull-request build gate. `just validate` only resolves the graph, so
  # before this job existed a PR could be green while main went red on the
  # merge commit. Building every image on two architectures per PR is not
  # viable, so this resolves the targets the PR can actually break from the
  # path ownership declared in elements/targets.json (`just changed-targets`),
  # and a change to a shared path builds the canary image instead of the world.
  changed-targets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      oci_images: ${{ steps.resolve.outputs.oci_images }}
      any_oci: ${{ steps.resolve.outputs.any_oci }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the recipe diffs against the merge base so the PR is
          # judged on its own changes only.
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just
      - id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TARGETS="$(just changed-targets "${BASE_SHA}" HEAD)"
          echo "==> affected targets: ${TARGETS}"
          OCI="$(jq -c '.oci_images' <<<"${TARGETS}")"
          MATRIX="$(jq -nc --argjson imgs "${OCI}" '
            [ $imgs[] as $img
              | (.archs[$img] // ["x86_64", "aarch64"])[] as $arch
              | { image: $img, arch: $arch,
                  runner: (if $arch == "x86_64" then "ubuntu-24.04" else "ubuntu-24.04-arm" end) } ]' \
            elements/targets.json)"
          {
            echo "oci_images=${OCI}"
            echo "any_oci=$(jq -r '.oci_images | length > 0' <<<"${TARGETS}")"
            echo "targets=${MATRIX}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pull-request build gate"
            echo
            echo "- OCI images built and verified: \`$(jq -r '.oci_images | if length == 0 then "none" else join(", ") end' <<<"${TARGETS}")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deliberately NOT a call into oci-images.yml: this job has no login, tag,
  # push, sign, or attest step at all, so a pull request -- including one from
  # a fork -- has no code path to publication. It only needs `contents: read`.
  pr-build-oci:
    needs: changed-targets
    if: github.event_name == 'pull_request' && needs.changed-targets.outputs.any_oci == 'true'
    strategy:
      fail-fast: false
      # Per-image {image, arch, runner} combos, generated from the canonical
      # 'archs' map in elements/targets.json by the changed-targets job.
      matrix:
        include: ${{ fromJson(needs.changed-targets.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2
        with:
          tool: just
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Compute OCI Metadata
        run: |
          echo "OCI_IMAGE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OCI_IMAGE_CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - name: Build and verify ${{ matrix.image }} (${{ matrix.arch }})
        run: |
          BUILD_IMAGE_NAME=${{ matrix.image }} just build
          BUILD_IMAGE_NAME=${{ matrix.image }} just verify
      - name: Vulnerability scan ${{ matrix.image }} (${{ matrix.arch }})
        # Gate: fails on high/critical findings that have a fix available.
        run: just scan "${{ matrix.image }}"

  # Resolve the OCI image matrix from the single canonical manifest
  # (elements/targets.json) once, so oci-images.yml never hand-maintains its
  # own copy of the image list. Adding a package requires one entry in that
  # manifest, not an edit to any workflow.
  matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      oci_targets: ${{ steps.set.outputs.oci_targets }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}
          persist-credentials: false
      - id: set
        env:
          SELECTED_IMAGE: ${{ github.event.inputs.image || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${SELECTED_IMAGE}" ]]; then
            if ! jq -e --arg image "${SELECTED_IMAGE}" \
              '.oci_images | index($image) != null' elements/targets.json >/dev/null; then
              echo "ERROR: unknown OCI image '${SELECTED_IMAGE}' (see elements/targets.json)" >&2
              exit 1
            fi
            OCI_IMAGES="$(jq -cn --arg image "${SELECTED_IMAGE}" '[$image]')"
          else
            OCI_IMAGES="$(jq -c '.oci_images' elements/targets.json)"
          fi
          TARGETS="$(jq -nc --argjson imgs "${OCI_IMAGES}" '
            [ $imgs[] as $img
              | { image: $img, archs: (.archs[$img] // ["x86_64", "aarch64"]) } ]' \
            elements/targets.json)"
          echo "oci_targets=${TARGETS}" >> "$GITHUB_OUTPUT"

  oci-images:
    needs: matrix
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.oci_targets) }}
    uses: ./.github/workflows/oci-images.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      image: ${{ matrix.image }}
      archs: ${{ toJSON(matrix.archs) }}
      ref: ${{ github.event.client_payload.ref || github.ref }}
    secrets: inherit

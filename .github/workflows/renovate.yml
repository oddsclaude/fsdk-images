name: Renovate

# Self-hosted Renovate run so dependency/hash bumps land as PRs without
# installing the hosted Renovate app.
#
# NOTE on token choice: with the default GITHUB_TOKEN, Renovate-created
# branches and PRs do not trigger other workflows, so the pull-request build
# gate in build.yml will not run on Renovate PRs. That is fine for the
# git-hash/action-digest updates this config produces (image content is
# unchanged), but if you want Renovate PRs to also run CI, swap in a GitHub
# App installation token (like projectbluefin's Mergeraptor):
#
#   - id: app-token
#     uses: actions/create-github-app-token@v3
#     with:
#       app-id: ${{ secrets.YOUR_APP_ID }}
#       private-key: ${{ secrets.YOUR_APP_PRIVATE_KEY }}
#   ...
#   token: ${{ steps.app-token.outputs.token }}
#
# An app token also makes `platformAutomerge` work; with GITHUB_TOKEN keep it
# false (as configured in renovate.json).

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log only; create or update nothing
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create branches and pull requests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == true && 'full' || '' }}
